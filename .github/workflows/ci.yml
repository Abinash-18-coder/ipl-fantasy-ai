name: IPL Fantasy AI - CI Pipeline

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-build:
    name: ESLint, TypeScript & Turbopack Build
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: 1. Checkout Repository Code
        uses: actions/checkout@v4

      - name: 2. Setup Node.js v24 Environment
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: 3. Install Dependencies Cleanly
        run: npm ci

      - name: 4. Run Next.js Route Typegen & TypeScript Compiler Check
        run: npm run typecheck

      - name: 5. Run ESLint v9 Zero-Warning Check
        run: npm run lint

      - name: 6. Verify Production Next.js 16.3.8 Build
        run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
          NEXT_PUBLIC_SUPABASE_URL: "https://placeholder-project.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder-anon-key"
          SUPABASE_SERVICE_ROLE_KEY: "placeholder-service-role-key"
          GEMINI_API_KEY: "placeholder-gemini-api-key"
          GEMINI_MODEL: "gemini-3.8-flash"
          GEMINI_THINKING_LEVEL: "high"
          GEMINI_DEEP_RESEARCH_MODE: "true"
          CRICKET_API_KEY: "placeholder-cricket-api-key"
          CRICKET_API_BASE_URL: "https://api.cricapi.com/v1"
          UPSTASH_REDIS_REST_URL: "https://placeholder-redis.upstash.io"
          UPSTASH_REDIS_REST_TOKEN: "placeholder-upstash-token"